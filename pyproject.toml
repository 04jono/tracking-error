[project]
name = "tracking-error"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate==1.13.0",
    "av==16.1.0",
    "h5py>=3.0.0",
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
    "opencv-python>=4.5.0",
    "python-dotenv>=1.2.2",
    "requests>=2.25.0",
    "scipy>=1.7.0",
    "transformers==5.8.1",
    "vllm==0.19.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
